name: Build Muravey STL

on:
  push:
    branches: [main]
    paths:
      - 'muravey-samodelka/v3/**'
      - '.github/workflows/build-muravey-stl.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb

      - name: Restore vector source
        working-directory: muravey-samodelka/v3
        run: |
          base64 -d details_v3.svg.gz.b64 | gunzip > details_v3.svg
          test -s details_v3.svg

      - name: Build clean v3 STL files
        working-directory: muravey-samodelka/v3
        run: |
          xvfb-run -a openscad -o ../muravey_samodelka_badge_v3_160mm.stl -D 'part="combined"' muravey_v3.scad
          xvfb-run -a openscad -o ../muravey_samodelka_badge_v3_silver.stl -D 'part="silver"' muravey_v3.scad
          xvfb-run -a openscad -o ../muravey_samodelka_badge_v3_black.stl -D 'part="black"' muravey_v3.scad
          cp ../muravey_samodelka_badge_v3_160mm.stl ../muravey_samodelka_badge_160mm.stl
          test -s ../muravey_samodelka_badge_v3_160mm.stl
          test -s ../muravey_samodelka_badge_v3_silver.stl
          test -s ../muravey_samodelka_badge_v3_black.stl

      - name: Commit STL files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add muravey-samodelka/muravey_samodelka_badge_160mm.stl \
                  muravey-samodelka/muravey_samodelka_badge_v3_160mm.stl \
                  muravey-samodelka/muravey_samodelka_badge_v3_silver.stl \
                  muravey-samodelka/muravey_samodelka_badge_v3_black.stl
          if git diff --cached --quiet; then
            echo "STL files are already up to date"
            exit 0
          fi
          git commit -m "Build clean Muravey Samodelka v3 STL models"
          git push
