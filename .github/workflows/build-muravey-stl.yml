name: Build Muravey Badge

on:
  push:
    branches: [main]
    paths:
      - 'muravey-samodelka/v3/**'
      - '.github/workflows/build-muravey-stl.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb

      - name: Restore vector source
        working-directory: muravey-samodelka/v3
        run: |
          base64 -d details_v3.svg.gz.b64 | gunzip > details_v3.svg
          test -s details_v3.svg

      - name: Build flat-base v5 STL files
        working-directory: muravey-samodelka/v3
        run: |
          xvfb-run -a openscad -o ../muravey_samodelka_badge_v5_flatbase.stl -D 'part="combined"' muravey_v3.scad
          xvfb-run -a openscad -o ../muravey_samodelka_badge_v5_black.stl -D 'part="black"' muravey_v3.scad
          xvfb-run -a openscad -o ../muravey_samodelka_badge_v5_silver.stl -D 'part="silver"' muravey_v3.scad
          cp ../muravey_samodelka_badge_v5_flatbase.stl ../muravey_samodelka_badge_160mm.stl
          test -s ../muravey_samodelka_badge_v5_flatbase.stl
          test -s ../muravey_samodelka_badge_v5_black.stl
          test -s ../muravey_samodelka_badge_v5_silver.stl

      - name: Build single-object v5 layer-change 3MF
        run: |
          python3 - <<'PY'
          import uuid, zipfile
          from pathlib import Path
          import xml.etree.ElementTree as ET

          CORE='http://schemas.microsoft.com/3dmanufacturing/core/2015/02'
          PROD='http://schemas.microsoft.com/3dmanufacturing/production/2015/06'
          ET.register_namespace('', CORE)
          ET.register_namespace('p', PROD)

          def read_stl(path):
              verts=[]; idx={}; tris=[]; tri=[]
              for line in Path(path).read_text(errors='ignore').splitlines():
                  s=line.strip()
                  if s.startswith('vertex '):
                      xyz=tuple(float(x) for x in s.split()[1:4])
                      if xyz not in idx:
                          idx[xyz]=len(verts); verts.append(xyz)
                      tri.append(idx[xyz])
                      if len(tri)==3:
                          tris.append(tuple(tri)); tri=[]
              if not tris:
                  raise RuntimeError(f'No triangles parsed from {path}')
              return verts,tris

          path=Path('muravey-samodelka/muravey_samodelka_badge_v5_flatbase.stl')
          verts,tris=read_stl(path)
          model=ET.Element(f'{{{CORE}}}model', {'unit':'millimeter'})
          resources=ET.SubElement(model, f'{{{CORE}}}resources')
          obj=ET.SubElement(resources, f'{{{CORE}}}object', {
              'id':'1','name':'muravey_samodelka_v5_flatbase','type':'model',f'{{{PROD}}}UUID':str(uuid.uuid4())})
          mesh=ET.SubElement(obj, f'{{{CORE}}}mesh')
          vs=ET.SubElement(mesh, f'{{{CORE}}}vertices')
          for x,y,z in verts:
              ET.SubElement(vs, f'{{{CORE}}}vertex', {'x':f'{x:.6g}','y':f'{y:.6g}','z':f'{z:.6g}'})
          ts=ET.SubElement(mesh, f'{{{CORE}}}triangles')
          for a,b,c in tris:
              ET.SubElement(ts, f'{{{CORE}}}triangle', {'v1':str(a),'v2':str(b),'v3':str(c)})
          build=ET.SubElement(model, f'{{{CORE}}}build', {f'{{{PROD}}}UUID':str(uuid.uuid4())})
          ET.SubElement(build, f'{{{CORE}}}item', {'objectid':'1',f'{{{PROD}}}UUID':str(uuid.uuid4())})

          xml=ET.tostring(model, encoding='utf-8', xml_declaration=True)
          rels=b'''<?xml version="1.0" encoding="utf-8"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel" Target="/3D/3dmodel.model" Id="rel0"/></Relationships>'''
          types=b'''<?xml version="1.0" encoding="utf-8"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/></Types>'''
          out=Path('muravey-samodelka/muravey_samodelka_badge_v5_flatbase_layerchange.3mf')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('[Content_Types].xml',types)
              z.writestr('_rels/.rels',rels)
              z.writestr('3D/3dmodel.model',xml)
          if out.stat().st_size < 1000:
              raise RuntimeError('3MF output is unexpectedly small')
          PY

      - name: Commit flat-base printable files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add muravey-samodelka/muravey_samodelka_badge_160mm.stl \
                  muravey-samodelka/muravey_samodelka_badge_v5_flatbase.stl \
                  muravey-samodelka/muravey_samodelka_badge_v5_black.stl \
                  muravey-samodelka/muravey_samodelka_badge_v5_silver.stl \
                  muravey-samodelka/muravey_samodelka_badge_v5_flatbase_layerchange.3mf
          if git diff --cached --quiet; then
            echo "Printable files are already up to date"
            exit 0
          fi
          git commit -m "Build flat-base Muravey Samodelka v5 files"
          git push
