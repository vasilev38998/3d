name: Build Muravey Lifan KP230 Badge

on:
  push:
    branches: [main]
    paths:
      - 'muravey-lifan-kp230/muravey_lifan_kp230.scad'
      - '.github/workflows/build-muravey-lifan-kp230.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenSCAD and font
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad fonts-dejavu-core

      - name: Build single solid v9 STL
        working-directory: muravey-lifan-kp230
        run: |
          openscad -o muravey_lifan_kp230_SOLID100_v9.stl -D 'part="solid100"' muravey_lifan_kp230.scad
          test -s muravey_lifan_kp230_SOLID100_v9.stl

      - name: Validate and package 100 percent infill 3MF
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          import xml.etree.ElementTree as ET

          CORE='http://schemas.microsoft.com/3dmanufacturing/core/2015/02'
          ET.register_namespace('',CORE)

          def read_stl(path):
              verts=[]; index={}; tris=[]; tri=[]; zs=[]
              for line in Path(path).read_text(errors='ignore').splitlines():
                  s=line.strip()
                  if s.startswith('vertex '):
                      xyz=tuple(float(x) for x in s.split()[1:4]); zs.append(xyz[2])
                      if xyz not in index:
                          index[xyz]=len(verts); verts.append(xyz)
                      tri.append(index[xyz])
                      if len(tri)==3:
                          tris.append(tuple(tri)); tri=[]
              if not tris: raise RuntimeError(path)
              return verts,tris,(min(zs),max(zs))

          root=Path('muravey-lifan-kp230')
          verts,tris,zr=read_stl(root/'muravey_lifan_kp230_SOLID100_v9.stl')
          print('MODEL Z RANGE',zr)
          assert abs(zr[0]-0.0)<1e-6
          assert abs(zr[1]-3.0)<1e-6

          model=ET.Element(f'{{{CORE}}}model',{'unit':'millimeter','xml:lang':'ru-RU'})
          ET.SubElement(model,f'{{{CORE}}}metadata',{'name':'Title'}).text='Muravey Lifan KP230 SOLID100 v9'
          ET.SubElement(model,f'{{{CORE}}}metadata',{'name':'Description'}).text='Single manifold model. Slice at fixed 0.20 mm, 100% infill, 10 bottom layers, 0 top shell layers. Change color after layer 10.'
          resources=ET.SubElement(model,f'{{{CORE}}}resources')
          obj=ET.SubElement(resources,f'{{{CORE}}}object',{'id':'1','name':'LIFAN_KP230_SOLID100_V9','type':'model'})
          mesh=ET.SubElement(obj,f'{{{CORE}}}mesh')
          vs=ET.SubElement(mesh,f'{{{CORE}}}vertices')
          for x,y,z in verts:
              ET.SubElement(vs,f'{{{CORE}}}vertex',{'x':f'{x:.6g}','y':f'{y:.6g}','z':f'{z:.6g}'})
          ts=ET.SubElement(mesh,f'{{{CORE}}}triangles')
          for a,b,c in tris:
              ET.SubElement(ts,f'{{{CORE}}}triangle',{'v1':str(a),'v2':str(b),'v3':str(c)})
          build=ET.SubElement(model,f'{{{CORE}}}build')
          ET.SubElement(build,f'{{{CORE}}}item',{'objectid':'1'})
          model_xml=ET.tostring(model,encoding='utf-8',xml_declaration=True)

          config=ET.Element('config')
          objcfg=ET.SubElement(config,'object',{'id':'1'})
          ET.SubElement(objcfg,'metadata',{'key':'name','value':'LIFAN_KP230_SOLID100_V9'})
          part=ET.SubElement(objcfg,'part',{'id':'1','subtype':'normal_part'})
          ET.SubElement(part,'metadata',{'key':'name','value':'SOLID100_SINGLE_MESH'})
          ET.SubElement(part,'metadata',{'key':'extruder','value':'1'})
          plate=ET.SubElement(config,'plate')
          ET.SubElement(plate,'metadata',{'key':'plater_id','value':'1'})
          ET.SubElement(plate,'metadata',{'key':'plater_name','value':'Lifan KP230 SOLID100 v9'})
          model_settings=ET.tostring(config,encoding='utf-8',xml_declaration=True)

          project_settings=json.dumps({
              'layer_height':'0.20',
              'initial_layer_print_height':'0.20',
              'wall_generator':'classic',
              'sparse_infill_density':'100%',
              'sparse_infill_pattern':'rectilinear',
              'internal_solid_infill_pattern':'rectilinear',
              'bottom_shell_layers':'10',
              'bottom_shell_thickness':'2.00',
              'top_shell_layers':'0',
              'top_shell_thickness':'0',
              'filament_colour':['#181818'],
              'filament_type':['PLA'],
              'filament_vendor':['Generic'],
              'filament_settings_id':['Generic PLA'],
              'filament_diameter':['1.75']
          },indent=2).encode('utf-8')

          rels=b'<?xml version="1.0" encoding="utf-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel" Target="/3D/3dmodel.model" Id="rel0"/></Relationships>'
          types=b'<?xml version="1.0" encoding="utf-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="config" ContentType="application/octet-stream"/></Types>'
          out=root/'muravey_lifan_kp230_SOLID100_v9.3mf'
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('[Content_Types].xml',types)
              z.writestr('_rels/.rels',rels)
              z.writestr('3D/3dmodel.model',model_xml)
              z.writestr('Metadata/model_settings.config',model_settings)
              z.writestr('Metadata/project_settings.config',project_settings)
          assert out.stat().st_size>1000
          PY

      - name: Commit v9 files
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/lifan-v9
          cp muravey-lifan-kp230/muravey_lifan_kp230_SOLID100_v9.stl /tmp/lifan-v9/
          cp muravey-lifan-kp230/muravey_lifan_kp230_SOLID100_v9.3mf /tmp/lifan-v9/
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/lifan-v9/* muravey-lifan-kp230/
            git add muravey-lifan-kp230/muravey_lifan_kp230_SOLID100_v9.stl muravey-lifan-kp230/muravey_lifan_kp230_SOLID100_v9.3mf
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Build Lifan KP230 SOLID100 v9"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
