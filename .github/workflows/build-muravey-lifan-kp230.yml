name: Build Muravey Lifan KP230 Badge

on:
  push:
    branches: [main]
    paths:
      - 'muravey-lifan-kp230/muravey_lifan_kp230.scad'
      - '.github/workflows/build-muravey-lifan-kp230.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenSCAD and font
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb fonts-dejavu-core

      - name: Build 0.20-layer-step model
        working-directory: muravey-lifan-kp230
        run: |
          openscad -o muravey_lifan_kp230_layerstep020_v5.stl -D 'part="layerstep"' muravey_lifan_kp230.scad
          openscad -o muravey_lifan_kp230_base_v5.stl -D 'part="base"' muravey_lifan_kp230.scad
          openscad -o muravey_lifan_kp230_relief_v5.stl -D 'part="relief"' muravey_lifan_kp230.scad
          xvfb-run -a openscad -o muravey_lifan_kp230_preview.png --imgsize=1800,700 --projection=ortho --camera=0,0,0,0,0,0,190 -D 'part="preview"' muravey_lifan_kp230.scad
          test -s muravey_lifan_kp230_layerstep020_v5.stl

      - name: Validate geometry separation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def zr(path):
              zs=[]
              for line in Path(path).read_text(errors='ignore').splitlines():
                  s=line.strip()
                  if s.startswith('vertex '):
                      zs.append(float(s.split()[3]))
              if not zs:
                  raise RuntimeError(f'No vertices in {path}')
              return min(zs), max(zs)

          bmin,bmax=zr('muravey-lifan-kp230/muravey_lifan_kp230_base_v5.stl')
          rmin,rmax=zr('muravey-lifan-kp230/muravey_lifan_kp230_relief_v5.stl')
          print(f'BASE   Z={bmin:.3f}..{bmax:.3f}')
          print(f'RELIEF Z={rmin:.3f}..{rmax:.3f}')
          print(f'GAP={rmin-bmax:.3f} mm')
          assert abs(bmin-0.0) < 1e-6
          assert abs(bmax-2.0) < 1e-6
          assert abs(rmin-2.19) < 1e-6
          assert abs(rmax-3.19) < 1e-6
          assert rmin > 2.0
          PY

      - name: Build one-object 3MF
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          import xml.etree.ElementTree as ET

          CORE='http://schemas.microsoft.com/3dmanufacturing/core/2015/02'
          ET.register_namespace('', CORE)

          def read_stl(path):
              verts=[]; index={}; tris=[]; tri=[]
              for line in Path(path).read_text(errors='ignore').splitlines():
                  s=line.strip()
                  if s.startswith('vertex '):
                      xyz=tuple(float(x) for x in s.split()[1:4])
                      if xyz not in index:
                          index[xyz]=len(verts); verts.append(xyz)
                      tri.append(index[xyz])
                      if len(tri)==3:
                          tris.append(tuple(tri)); tri=[]
              if not tris:
                  raise RuntimeError(f'No triangles parsed from {path}')
              return verts,tris

          src=Path('muravey-lifan-kp230/muravey_lifan_kp230_layerstep020_v5.stl')
          verts,tris=read_stl(src)
          model=ET.Element(f'{{{CORE}}}model', {'unit':'millimeter','xml:lang':'ru-RU'})
          ET.SubElement(model, f'{{{CORE}}}metadata', {'name':'Title'}).text='Муравей Lifan KP230 — layerstep 0.20 v5'
          ET.SubElement(model, f'{{{CORE}}}metadata', {'name':'Description'}).text='Base ends at 2.00 mm; relief starts at 2.19 mm. Use 0.20 mm fixed layer height.'
          resources=ET.SubElement(model, f'{{{CORE}}}resources')
          obj=ET.SubElement(resources, f'{{{CORE}}}object', {'id':'1','name':'LIFAN_KP230_LAYERSTEP020_V5','type':'model'})
          mesh=ET.SubElement(obj, f'{{{CORE}}}mesh')
          vs=ET.SubElement(mesh, f'{{{CORE}}}vertices')
          for x,y,z in verts:
              ET.SubElement(vs, f'{{{CORE}}}vertex', {'x':f'{x:.6g}','y':f'{y:.6g}','z':f'{z:.6g}'})
          ts=ET.SubElement(mesh, f'{{{CORE}}}triangles')
          for a,b,c in tris:
              ET.SubElement(ts, f'{{{CORE}}}triangle', {'v1':str(a),'v2':str(b),'v3':str(c)})
          build=ET.SubElement(model, f'{{{CORE}}}build')
          ET.SubElement(build, f'{{{CORE}}}item', {'objectid':'1'})

          xml=ET.tostring(model, encoding='utf-8', xml_declaration=True)
          rels=b'''<?xml version="1.0" encoding="utf-8"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel" Target="/3D/3dmodel.model" Id="rel0"/></Relationships>'''
          types=b'''<?xml version="1.0" encoding="utf-8"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/></Types>'''
          out=Path('muravey-lifan-kp230/muravey_lifan_kp230_LAYERSTEP020_v5.3mf')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('[Content_Types].xml',types)
              z.writestr('_rels/.rels',rels)
              z.writestr('3D/3dmodel.model',xml)
          if out.stat().st_size < 1000:
              raise RuntimeError('3MF output unexpectedly small')
          PY

      - name: Commit generated files
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/lifan-v5
          cp muravey-lifan-kp230/muravey_lifan_kp230_layerstep020_v5.stl /tmp/lifan-v5/
          cp muravey-lifan-kp230/muravey_lifan_kp230_base_v5.stl /tmp/lifan-v5/
          cp muravey-lifan-kp230/muravey_lifan_kp230_relief_v5.stl /tmp/lifan-v5/
          cp muravey-lifan-kp230/muravey_lifan_kp230_LAYERSTEP020_v5.3mf /tmp/lifan-v5/
          cp muravey-lifan-kp230/muravey_lifan_kp230_preview.png /tmp/lifan-v5/

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/lifan-v5/* muravey-lifan-kp230/
            git add muravey-lifan-kp230/muravey_lifan_kp230_layerstep020_v5.stl \
                    muravey-lifan-kp230/muravey_lifan_kp230_base_v5.stl \
                    muravey-lifan-kp230/muravey_lifan_kp230_relief_v5.stl \
                    muravey-lifan-kp230/muravey_lifan_kp230_LAYERSTEP020_v5.3mf \
                    muravey-lifan-kp230/muravey_lifan_kp230_preview.png
            if git diff --cached --quiet; then
              echo "Generated files are already current"
              exit 0
            fi
            git commit -m "Build Lifan KP230 layerstep 0.20 v5"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          exit 1
