name: Build Muravey Lifan KP230 Badge

on:
  push:
    branches: [main]
    paths:
      - 'muravey-lifan-kp230/muravey_lifan_kp230.scad'
      - '.github/workflows/build-muravey-lifan-kp230.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenSCAD and font
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad xvfb fonts-dejavu-core

      - name: Build base, relief and preview
        working-directory: muravey-lifan-kp230
        run: |
          openscad -o muravey_lifan_kp230_base_v4.stl -D 'part="base"' muravey_lifan_kp230.scad
          openscad -o muravey_lifan_kp230_relief_v4.stl -D 'part="relief"' muravey_lifan_kp230.scad
          openscad -o muravey_lifan_kp230_combined.stl -D 'part="combined"' muravey_lifan_kp230.scad
          cp muravey_lifan_kp230_base_v4.stl muravey_lifan_kp230_black.stl
          cp muravey_lifan_kp230_relief_v4.stl muravey_lifan_kp230_silver.stl
          xvfb-run -a openscad -o muravey_lifan_kp230_preview.png --imgsize=1800,700 --projection=ortho --camera=0,0,0,0,0,0,190 -D 'part="preview"' muravey_lifan_kp230.scad
          test -s muravey_lifan_kp230_base_v4.stl
          test -s muravey_lifan_kp230_relief_v4.stl

      - name: Validate Z ranges
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def zr(path):
              zs=[]
              for line in Path(path).read_text(errors='ignore').splitlines():
                  s=line.strip()
                  if s.startswith('vertex '):
                      zs.append(float(s.split()[3]))
              if not zs: raise RuntimeError(f'No vertices: {path}')
              return min(zs), max(zs)
          bmin,bmax=zr('muravey-lifan-kp230/muravey_lifan_kp230_base_v4.stl')
          rmin,rmax=zr('muravey-lifan-kp230/muravey_lifan_kp230_relief_v4.stl')
          print('BASE Z:', bmin, bmax)
          print('RELIEF Z:', rmin, rmax)
          assert abs(bmin-0.0)<1e-6 and abs(bmax-2.0)<1e-6
          assert abs(rmin-2.0)<1e-6 and abs(rmax-3.0)<1e-6
          PY

      - name: Build true-flat multipart 3MF
        run: |
          python3 - <<'PY'
          import uuid, zipfile, shutil
          from pathlib import Path
          import xml.etree.ElementTree as ET

          CORE='http://schemas.microsoft.com/3dmanufacturing/core/2015/02'
          ET.register_namespace('', CORE)

          def read_stl(path):
              verts=[]; index={}; tris=[]; tri=[]
              for line in Path(path).read_text(errors='ignore').splitlines():
                  s=line.strip()
                  if s.startswith('vertex '):
                      xyz=tuple(float(x) for x in s.split()[1:4])
                      if xyz not in index:
                          index[xyz]=len(verts); verts.append(xyz)
                      tri.append(index[xyz])
                      if len(tri)==3:
                          tris.append(tuple(tri)); tri=[]
              if not tris:
                  raise RuntimeError(f'No triangles parsed from {path}')
              return verts,tris

          root=Path('muravey-lifan-kp230')
          base_v,base_t=read_stl(root/'muravey_lifan_kp230_base_v4.stl')
          relief_v,relief_t=read_stl(root/'muravey_lifan_kp230_relief_v4.stl')

          model=ET.Element(f'{{{CORE}}}model', {'unit':'millimeter','xml:lang':'ru-RU'})
          ET.SubElement(model, f'{{{CORE}}}metadata', {'name':'Title'}).text='Муравей Lifan KP230 — true flat base v4'
          ET.SubElement(model, f'{{{CORE}}}metadata', {'name':'Description'}).text='Independent base and relief volumes; base 0-2 mm, relief 2-3 mm.'
          resources=ET.SubElement(model, f'{{{CORE}}}resources')

          mats=ET.SubElement(resources, f'{{{CORE}}}basematerials', {'id':'10'})
          ET.SubElement(mats, f'{{{CORE}}}base', {'name':'BASE','displaycolor':'#161616FF'})
          ET.SubElement(mats, f'{{{CORE}}}base', {'name':'RELIEF','displaycolor':'#C0C0C0FF'})

          def add_mesh_object(oid,name,verts,tris,pindex):
              obj=ET.SubElement(resources, f'{{{CORE}}}object', {
                  'id':str(oid),'name':name,'type':'model','pid':'10','pindex':str(pindex)})
              mesh=ET.SubElement(obj, f'{{{CORE}}}mesh')
              vs=ET.SubElement(mesh, f'{{{CORE}}}vertices')
              for x,y,z in verts:
                  ET.SubElement(vs, f'{{{CORE}}}vertex', {'x':f'{x:.6g}','y':f'{y:.6g}','z':f'{z:.6g}'})
              ts=ET.SubElement(mesh, f'{{{CORE}}}triangles')
              for a,b,c in tris:
                  ET.SubElement(ts, f'{{{CORE}}}triangle', {'v1':str(a),'v2':str(b),'v3':str(c)})

          add_mesh_object(1,'BASE_0_to_2mm',base_v,base_t,0)
          add_mesh_object(2,'RELIEF_2_to_3mm',relief_v,relief_t,1)

          assembly=ET.SubElement(resources, f'{{{CORE}}}object', {'id':'3','name':'Muravey_Lifan_KP230_TRUE_FLAT_V4','type':'model'})
          comps=ET.SubElement(assembly, f'{{{CORE}}}components')
          ET.SubElement(comps, f'{{{CORE}}}component', {'objectid':'1'})
          ET.SubElement(comps, f'{{{CORE}}}component', {'objectid':'2'})

          build=ET.SubElement(model, f'{{{CORE}}}build')
          ET.SubElement(build, f'{{{CORE}}}item', {'objectid':'3'})

          xml=ET.tostring(model, encoding='utf-8', xml_declaration=True)
          rels=b'''<?xml version="1.0" encoding="utf-8"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel" Target="/3D/3dmodel.model" Id="rel0"/></Relationships>'''
          types=b'''<?xml version="1.0" encoding="utf-8"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/></Types>'''

          out=root/'muravey_lifan_kp230_trueflat_multipart_v4.3mf'
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('[Content_Types].xml',types)
              z.writestr('_rels/.rels',rels)
              z.writestr('3D/3dmodel.model',xml)

          # Replace the old easy-to-click names as well, so they no longer point
          # to the problematic merged-mesh construction.
          shutil.copy2(out, root/'muravey_lifan_kp230_multicolor.3mf')
          shutil.copy2(out, root/'muravey_lifan_kp230_flatbase_layerchange_v2.3mf')
          if out.stat().st_size < 1000:
              raise RuntimeError('3MF output is unexpectedly small')
          PY

      - name: Commit generated printable files
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/lifan-build
          cp muravey-lifan-kp230/muravey_lifan_kp230_base_v4.stl /tmp/lifan-build/
          cp muravey-lifan-kp230/muravey_lifan_kp230_relief_v4.stl /tmp/lifan-build/
          cp muravey-lifan-kp230/muravey_lifan_kp230_combined.stl /tmp/lifan-build/
          cp muravey-lifan-kp230/muravey_lifan_kp230_black.stl /tmp/lifan-build/
          cp muravey-lifan-kp230/muravey_lifan_kp230_silver.stl /tmp/lifan-build/
          cp muravey-lifan-kp230/muravey_lifan_kp230_trueflat_multipart_v4.3mf /tmp/lifan-build/
          cp muravey-lifan-kp230/muravey_lifan_kp230_multicolor.3mf /tmp/lifan-build/
          cp muravey-lifan-kp230/muravey_lifan_kp230_flatbase_layerchange_v2.3mf /tmp/lifan-build/
          cp muravey-lifan-kp230/muravey_lifan_kp230_preview.png /tmp/lifan-build/

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/lifan-build/* muravey-lifan-kp230/
            git add muravey-lifan-kp230/muravey_lifan_kp230_base_v4.stl \
                    muravey-lifan-kp230/muravey_lifan_kp230_relief_v4.stl \
                    muravey-lifan-kp230/muravey_lifan_kp230_combined.stl \
                    muravey-lifan-kp230/muravey_lifan_kp230_black.stl \
                    muravey-lifan-kp230/muravey_lifan_kp230_silver.stl \
                    muravey-lifan-kp230/muravey_lifan_kp230_trueflat_multipart_v4.3mf \
                    muravey-lifan-kp230/muravey_lifan_kp230_multicolor.3mf \
                    muravey-lifan-kp230/muravey_lifan_kp230_flatbase_layerchange_v2.3mf \
                    muravey-lifan-kp230/muravey_lifan_kp230_preview.png
            if git diff --cached --quiet; then
              echo "Printable files are already up to date"
              exit 0
            fi
            git commit -m "Build true-flat multipart Lifan KP230 v4"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 3
          done
          echo "Could not publish generated files after retries"
          exit 1
